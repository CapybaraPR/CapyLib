name: Build and Release CapyLib

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore CapyLib.csproj

      - name: Build CapyLib.dll (Release)
        run: dotnet build CapyLib.csproj -c Release --no-restore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapyLib-Release
          path: bin/Release/net48/CapyLib.dll

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net48/CapyLib.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
